<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz - Quiz Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('home') }}" class="logo">📝 Quiz Master</a>
            <nav class="nav-buttons">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="{{ url_for('settings') }}" class="btn btn-secondary">⚙️ Settings</a>
            </nav>
        </header>

        <main>
            <div class="card">
                <h2 class="card-title">Select Quiz to Edit</h2>
                <div id="quizListContainer">
                    <p style="color: var(--text-secondary); text-align: center;">Loading quizzes...</p>
                </div>
            </div>

            <div class="card hidden" id="editCard">
                <h2 class="card-title">Edit Quiz</h2>
                
                <div class="form-group">
                    <label class="form-label" for="quizTitle">Quiz Title</label>
                    <input type="text" id="quizTitle" class="form-input" placeholder="Enter quiz title...">
                </div>

                <div id="questionsContainer"></div>

                <div class="flex gap-10 mt-20">
                    <button class="btn btn-primary" onclick="addQuestion()">➕ Add Question</button>
                    <button class="btn btn-secondary" onclick="addGroupDivider()">📁 Add Group Divider</button>
                </div>
            </div>

            <div class="card hidden" id="saveCard">
                <h3 class="card-title">Save Changes</h3>
                <div class="flex gap-10">
                    <button class="btn btn-success" onclick="saveQuiz()">💾 Save to Server</button>
                    <button class="btn btn-secondary" onclick="downloadQuiz()">📥 Download JSON</button>
                </div>
            </div>

            <div class="flex justify-between mt-20">
                <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Home</a>
                <span id="saveStatus" style="color: var(--text-secondary)"></span>
            </div>
        </main>
    </div>

    <!-- Question Template -->
    <template id="questionTemplate">
        <div class="question-card draggable" draggable="true">
            <div class="question-header">
                <span class="question-number">Question <span class="qNum"></span></span>
                <div class="question-actions">
                    <button class="btn btn-icon btn-secondary" onclick="addMedia(this)" title="Add Media">📎</button>
                    <button class="btn btn-icon btn-danger" onclick="deleteQuestion(this)" title="Delete">🗑️</button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Question Text (Markdown supported)</label>
                <textarea class="form-input question-text" rows="3" placeholder="Enter your question..."></textarea>
            </div>

            <div class="media-container"></div>

            <div class="form-group">
                <label class="form-label">Options (minimum 2)</label>
                <div class="options-container"></div>
                <button class="btn btn-secondary btn-sm mt-10" onclick="addOption(this)">+ Add Option</button>
            </div>
        </div>
    </template>

    <!-- Group Divider Template -->
    <template id="groupDividerTemplate">
        <div class="group-divider draggable" draggable="true">
            <span>📁</span>
            <input type="text" class="group-divider-input" placeholder="Group Name" value="New Group">
            <button class="btn btn-icon btn-danger" onclick="deleteElement(this)" title="Delete">🗑️</button>
        </div>
    </template>

    <!-- Media Upload Modal -->
    <div id="mediaModal" class="modal-overlay hidden">
        <div class="modal">
            <h3 class="modal-title">Add Media</h3>
            <div class="form-group">
                <label class="form-label">Select File</label>
                <input type="file" id="mediaFile" class="form-input" accept="image/*,audio/*,video/*">
            </div>
            <div id="mediaPreview" class="media-preview hidden"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeMediaModal()">Cancel</button>
                <button class="btn btn-primary" onclick="uploadMedia()">Upload</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/creator.js') }}"></script>
    <script>
        // Load quiz list on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadQuizList();
        });

        async function loadQuizList() {
            try {
                const response = await fetch('/api/quiz/list');
                const quizzes = await response.json();
                const container = document.getElementById('quizListContainer');
                
                if (quizzes.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">No saved quizzes found. Create one first!</p>';
                    return;
                }
                
                let html = '<ul class="quiz-list">';
                quizzes.forEach(quiz => {
                    html += `
                        <li class="quiz-item">
                            <div class="quiz-info">
                                <div class="quiz-title">${escapeHtml(quiz.title)}</div>
                                <div class="quiz-meta">${quiz.question_count} questions • Created ${quiz.created_at}</div>
                            </div>
                            <div class="quiz-actions">
                                <button class="btn btn-primary" onclick="loadQuizForEdit('${quiz.filename}')">✏️ Edit</button>
                                <button class="btn btn-secondary" onclick="downloadQuizFile('${quiz.filename}')">📥 Download</button>
                                <button class="btn btn-danger" onclick="deleteQuizFile('${quiz.filename}')">🗑️ Delete</button>
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading quizzes:', error);
                document.getElementById('quizListContainer').innerHTML = 
                    '<p style="color: var(--error-color); text-align: center;">Error loading quizzes</p>';
            }
        }

        async function loadQuizForEdit(filename) {
            try {
                const response = await fetch(`/api/quiz/load/${encodeURIComponent(filename)}`);
                const quizData = await response.json();
                
                if (quizData.error) {
                    alert('Error loading quiz: ' + quizData.error);
                    return;
                }
                
                // Populate the form
                document.getElementById('quizTitle').value = quizData.title || '';
                document.getElementById('questionsContainer').innerHTML = '';
                
                // Load questions
                if (quizData.questions) {
                    quizData.questions.forEach(q => {
                        if (q.type === 'question') {
                            addQuestion(q.text, q.options, q.correctAnswerIndex, q.media);
                        } else if (q.type === 'group-divider') {
                            addGroupDivider(q.label);
                        }
                    });
                }
                
                // Show edit cards
                document.getElementById('quizListContainer').classList.add('hidden');
                document.getElementById('editCard').classList.remove('hidden');
                document.getElementById('saveCard').classList.remove('hidden');
                
                // Store current filename for saving
                window.currentQuizFilename = filename;
                
            } catch (error) {
                console.error('Error loading quiz:', error);
                alert('Error loading quiz');
            }
        }

        async function deleteQuizFile(filename) {
            if (!confirm('Are you sure you want to delete this quiz?')) return;
            
            try {
                const response = await fetch(`/api/quiz/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    loadQuizList();
                } else {
                    alert('Error deleting quiz: ' + result.error);
                }
            } catch (error) {
                console.error('Error deleting quiz:', error);
                alert('Error deleting quiz');
            }
        }

        function downloadQuizFile(filename) {
            window.location.href = `/api/download/${encodeURIComponent(filename)}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
