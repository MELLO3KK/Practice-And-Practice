<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('home') }}" class="logo">📝 Quiz Master</a>
            <nav class="nav-buttons">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="{{ url_for('settings') }}" class="btn btn-secondary">⚙️ Settings</a>
            </nav>
        </header>

        <main class="home-container">
            <h1 class="home-title">Quiz Master</h1>
            <p class="home-subtitle">Create, edit, and take quizzes with ease</p>
            
            <div class="home-buttons">
                <a href="{{ url_for('create_quiz') }}" class="btn btn-primary home-btn">
                    ➕ Create a New Quiz
                </a>
                <a href="{{ url_for('edit_quiz') }}" class="btn btn-secondary home-btn">
                    ✏️ Edit a Quiz
                </a>
                <a href="{{ url_for('take_quiz') }}" class="btn btn-success home-btn">
                    🎯 Take a Quiz
                </a>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
