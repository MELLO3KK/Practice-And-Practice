<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - Quiz Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('home') }}" class="logo">📝 Quiz Master</a>
            <nav class="nav-buttons">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <a href="{{ url_for('settings') }}" class="btn btn-secondary">⚙️ Settings</a>
            </nav>
        </header>

        <!-- Quiz Selection Screen -->
        <main id="selectionScreen">
            <div class="card">
                <h2 class="card-title">Select a Quiz to Take</h2>
                <div id="quizListContainer">
                    <p style="color: var(--text-secondary); text-align: center;">Loading quizzes...</p>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">Or Load from File</h3>
                <div class="flex gap-10">
                    <button class="btn btn-primary" onclick="document.getElementById('quizFileInput').click()">📂 Load JSON File</button>
                    <input type="file" id="quizFileInput" accept=".json" style="display:none" onchange="handleFileLoad(event)">
                </div>
            </div>

            <div class="flex justify-between mt-20">
                <a href="{{ url_for('home') }}" class="btn btn-secondary">← Back to Home</a>
            </div>
        </main>

        <!-- Quiz Taking Screen -->
        <main id="quizScreen" class="quiz-taker hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div id="timerDisplay" class="timer-display hidden">⏱️ <span id="timerValue">30</span>s</div>

            <div class="card">
                <h2 id="quizTitleDisplay" class="card-title"></h2>
                
                <div id="groupDividerDisplay" class="group-divider hidden" style="background: var(--bg-primary); border: 2px solid var(--border-color);">
                    <span>📁</span>
                    <span id="currentGroupLabel" style="font-weight: bold;"></span>
                </div>

                <div class="question-text" id="questionText"></div>

                <div id="questionMedia" class="media-container mb-20"></div>

                <div class="options-grid" id="optionsGrid"></div>

                <div id="feedback" class="feedback hidden"></div>

                <div class="flex gap-10 justify-between">
                    <button class="btn btn-secondary" onclick="exitQuiz()">✕ Exit Quiz</button>
                    <button class="btn btn-primary" id="checkAnswerBtn" onclick="checkAnswer()">✓ Check Answer</button>
                    <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Next →</button>
                </div>
            </div>

            <p style="text-align: center; color: var(--text-secondary); margin-top: 15px; font-size: 0.9rem;">
                Keyboard: 1-6 to select, Enter/Space to check, Esc to exit
            </p>
        </main>

        <!-- Results Screen -->
        <main id="resultsScreen" class="results-container hidden">
            <div class="confetti-container" id="confettiContainer"></div>
            
            <h1 class="home-title">Quiz Complete! 🎉</h1>
            
            <div class="score-display" id="scoreDisplay">0%</div>
            <div class="score-message" id="scoreMessage">Great effort!</div>
            
            <div class="card" style="max-width: 400px; margin: 0 auto 30px;">
                <p><strong>Score:</strong> <span id="finalScore">0</span> / <span id="totalQuestions">0</span></p>
                <p><strong>Correct:</strong> <span id="correctCount">0</span></p>
                <p><strong>Incorrect:</strong> <span id="incorrectCount">0</span></p>
                <p id="timeStats" class="hidden"><strong>Time:</strong> <span id="timeTaken">0</span>s</p>
            </div>

            <div class="results-actions">
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
                <button class="btn btn-success" onclick="location.href='/take'">📝 Take Another Quiz</button>
                <a href="{{ url_for('home') }}" class="btn btn-secondary">🏠 Home</a>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/taker.js') }}"></script>
</body>
</html>
